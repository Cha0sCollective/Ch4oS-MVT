name: Expanded MVT checks
on:
  pull_request:
    paths: ['mvt/**', 'client-mod/**', 'server-mod/**', 'worker/**', 'test_mvt*.py', '.github/workflows/expanded-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harness:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python -B -m unittest discover -p 'test_*.py' -v
  automation-build:
    strategy:
      matrix:
        neoforge: ['21.1.233', '21.1.248']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.14.4'
      - name: Compile against the declared NeoForge runtime
        working-directory: client-mod
        env:
          NEOFORGE: ${{ matrix.neoforge }}
        run: gradle --no-daemon -Pneo_version="$NEOFORGE" build exportMvtLaunch
      - name: Compile the dedicated development-server bootstrap
        working-directory: server-mod
        env:
          NEOFORGE: ${{ matrix.neoforge }}
        run: gradle --no-daemon -Pneo_version="$NEOFORGE" build exportMvtServerLaunch
